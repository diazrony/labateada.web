<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Bateada · MLB Hoy</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>La Bateada</h1>
    <p id="fecha"></p>
  </header>

  <nav class="page-nav" aria-label="Page navigation">
    <a class="page-nav-link activo" href="/index.html">Scores</a>
    <a class="page-nav-link" href="/teams.html">Teams</a>
  </nav>

  <nav class="date-nav" aria-label="Date navigation">
    <div class="date-nav-row">
      <button type="button" id="prev-day" class="date-nav-arrow" aria-label="Previous day">‹</button>
      <div class="date-nav-tabs" role="tablist">
        <button type="button" class="date-tab" data-offset="-1">Yesterday</button>
        <button type="button" class="date-tab" data-offset="0">Today</button>
        <button type="button" class="date-tab" data-offset="1">Tomorrow</button>
      </div>
      <button type="button" id="next-day" class="date-nav-arrow" aria-label="Next day">›</button>
    </div>
    <input type="date" id="date-picker" class="date-picker" aria-label="Pick a date">
  </nav>

  <main id="juegos">
    <p class="estado">Cargando resultados...</p>
  </main>

  <footer>
    <p>Datos: MLB Stats API</p>
  </footer>

  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
